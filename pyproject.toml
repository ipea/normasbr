[project]
name = "normasbr"
version = "0.1.0"
description = "Extração, segmentação e estruturação de normativas brasileiras"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
authors = [
    { name = "Gabriel Garcia de Almeida", email = "gabriel.almeida@ipea.gov.br" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.5.1",
    "lxml>=6.1.0",
    "mammoth>=1.12.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pyserde>=0.31.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
    "typer>=0.23.1",
]

[project.scripts]
normasbr = "normasbr.cli:app"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
addopts = "--cov=normasbr --cov-report=term-missing"

[tool.coverage.run]
source = ["normasbr"]
omit = ["normasbr/classificacao/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
