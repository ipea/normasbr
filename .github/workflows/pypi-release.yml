name: PyPI Release

on:
  push:
    tags:
      - "v.+"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30
        with:
          enable-cache: false

      - name: Unit tests
        run: uv run pytest && uv run ruff check .

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PROJECT_VERSION="$(uv version --short)"

          if [ "$VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag:     $VERSION"
            echo "Project: $PROJECT_VERSION"
            exit 1
          fi

      - name: Smoke test wheel
        run: |
          uv run \
            --isolated \
            --no-project \
            --with dist/*.whl \
            python -c "import normasbr"

      - name: Smoke test source distribution
        run: |
          uv run \
            --isolated \
            --no-project \
            --with dist/*.tar.gz \
            python -c "import normasbr"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish package
    needs:
      - build

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/normasbr

    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027

      - name: Publish to PyPI
        run: uv publish
